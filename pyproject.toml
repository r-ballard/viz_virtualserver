[project]
name = "viz-virtualserver"
version = "0.1.0"
description = "Geometry computation service for generative visualization and pen plotting workflows"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.139,<1",
    "numpy>=2.5,<3",
    "scipy>=1.18,<2",
    "shapely>=2.1,<3",
    "uvicorn[standard]>=0.51,<1",
]

[project.scripts]
viz-domain-bundle = "viz_virtualserver.cli.domain_bundle:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[tool.uv.build-backend]
module-name = "viz_virtualserver"
module-root = ""

[tool.uv.workspace]
members = ["renderer"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["scripts", "viz_virtualserver"]
